<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>Switch control / Progressive Enhancement / FDND</title>
		<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
		<link href="assets/styles.css" rel="stylesheet">
		<style>
		
		label {
			display:inline-flex;
			align-items:center;
			/* gap:.25em; */
	
			cursor:pointer;
		}

		input {
			--switch-width: 5em;
			--thumb-width: 2em;
			--switch-padding: .2rem;
			
			appearance:none;
			width: var(--switch-width);
			background-color: grey;
			border-radius: 2em;
			cursor:pointer;
			padding: var(--switch-padding);
		}

		input::after {
			content: "";
			width: var(--thumb-width);
			height: var(--thumb-width);
			background-color: white;
			border-radius: inherit;
			line-height: 1;
			display: grid;
			justify-content: center;
			align-content: center;
	
			transition: .3s;
		}

		input:checked::after {
			background-color: white;
			transform: translateX( calc(var(--switch-width) - var(--thumb-width) - var(--switch-padding) * 2));
			content: "aan";
			font-weight: 600;
		}
		input:checked {
			background-color: rgb(123, 225, 192);
		}
			
			
			/* Schrijf hier gewoon je CSS voor dit component */

			/* Hint: Dit component kun je volledig met HTML en CSS bouwen */

			/* Hint: Hoe ver ga je qua styling? Vraag jezelf dit altijd af */
		</style>
	</head>
	<body>
		<h1>Switch control</h1>
		
	<label aria-label="aanknop">
		<input type="checkbox" name="" id="">
	</label>
		<!-- Hint: Safari heeft hiervoor iets bedacht, maar is dat al een standaard?
		     Wat gebeurt er in browsers die dat nog niet ondersteunen? -->

		<details open>
			<summary>Demo video</summary>
			<video src="assets/switch.mp4" width="119" height="67" controls muted autoplay loop>
				<a href="assets/switch.mp4">assets/switch.mp4</a>
			</video>
		</details>
	</body>
</html>
